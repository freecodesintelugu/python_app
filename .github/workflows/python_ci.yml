name: Python CI
on:
  push:
    branches: [main]
  pull_request: 
    branches:  [main]
  workflow_dispatch: 
permissions: 
  contents: read
jobs:
  lint:
    name: Code Quality check
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: python Set-up
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install lint Dependencey
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check .
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: python Set-up
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install test Dependencies
        run: python -m pip install Flask pytest
      - name: run tests and create reports
        run: python -m pytest --junitxml=test.results.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 7
  package:
    name: creat application package
    needs: [lint,test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create ZIP package
        run: zip -r task-tracker .zip app.py tests
      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-package
          path: task-tracker.zip
          retention-days: 7
        
        





      
          
